name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Compute tag from last commit date
        id: tag
        run: echo "value=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Delete existing release/tag with same date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: FYT-Launcher-Mod ${{ steps.tag.outputs.value }}
          body: Auto build from commit ${{ github.sha }}
          files: FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk
