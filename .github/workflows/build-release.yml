name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Compute tag and commit info
        id: tag
        run: |
          echo "value=$(git log -1 --format=%cd --date=format:%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "shortsha=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"
          echo "fullsha=$(git log -1 --format=%H)" >> "$GITHUB_OUTPUT"
          echo "msg=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Delete existing release/tag with same value
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Sign and rename APK (system/车机版)
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" sign \
            --ks app/keystore.jks \
            --ks-key-alias android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk \
            "$APK"
          "$APKSIGNER" verify --print-certs FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk

      - name: Prepare phone (non-privileged) manifest
        run: |
          # Remove system-only attributes so the APK also installs on normal
          # phones/emulators (same process as the released phone builds):
          # 1. drop sharedUserId="android.uid.system" (its trailing '>' moves to the tools line)
          sed -i '/android:sharedUserId="android.uid.system"/d' app/src/main/AndroidManifest.xml
          sed -i 's|    xmlns:tools="http://schemas.android.com/tools"$|    xmlns:tools="http://schemas.android.com/tools">|' app/src/main/AndroidManifest.xml
          # 2. drop the system permission group attributes
          sed -i '/android:permissionGroup="android.permission-group.SYSTEM_TOOLS"/d' app/src/main/AndroidManifest.xml
          echo "Remaining system-only attributes:"
          grep -c "sharedUserId\|permissionGroup" app/src/main/AndroidManifest.xml || true

      - name: Build phone release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign phone APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" sign \
            --ks app/keystore.jks \
            --ks-key-alias android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out FYT-Launcher-Mod-phone-${{ steps.tag.outputs.value }}.apk \
            "$APK"
          "$APKSIGNER" verify --print-certs FYT-Launcher-Mod-phone-${{ steps.tag.outputs.value }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: FYT-Launcher-Mod ${{ steps.tag.outputs.value }} (${{ steps.tag.outputs.shortsha }})
          body: |
            Auto build from commit `${{ steps.tag.outputs.fullsha }}`
            Last commit: ${{ steps.tag.outputs.msg }}

            - 车机版 (system): `FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk`
            - 手机版 (phone, non-privileged): `FYT-Launcher-Mod-phone-${{ steps.tag.outputs.value }}.apk`
          files: |
            FYT-Launcher-Mod-${{ steps.tag.outputs.value }}.apk
            FYT-Launcher-Mod-phone-${{ steps.tag.outputs.value }}.apk

      - name: Cleanup old releases (keep only the latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List releases newest-first and delete all but the most recent one
          gh release list --limit 50 --json createdAt,tagName \
            --template '{{range .}}{{.createdAt}} {{.tagName}}{{"\n"}}{{end}}' \
            | sort -r | tail -n +2 | while read -r _ tag; do
              echo "Deleting old release/tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
